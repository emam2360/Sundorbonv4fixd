          PY

      # --------------------------------------------------
      # 8. Build web app
      # --------------------------------------------------
      - name: Build PWA
        run: npm run build

      # --------------------------------------------------
      # 9. Add Android platform
      # --------------------------------------------------
      - name: Add Android platform
        run: npx cap add android

      # --------------------------------------------------
      # 10. Sync Capacitor
      # ------------------------------------------------
