name: Build Sundarban Drug House APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------
      # 3. Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # --------------------------------------------------
      # 4. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install


      # --------------------------------------------------
      # 5. TypeScript
      # --------------------------------------------------
      - name: Install TypeScript
        run: npm install -D typescript


      # --------------------------------------------------
      # 6. Install Capacitor Android
      # --------------------------------------------------
      - name: Install Capacitor Android
        run: npm install @capacitor/android@8.5.2


      # --------------------------------------------------
      # 7. Build web app
      # --------------------------------------------------
      - name: Build PWA
        run: npm run build


      # --------------------------------------------------
      # 8. Add Android platform
      # --------------------------------------------------
      - name: Add Android platform
        run: npx cap add android


      # --------------------------------------------------
      # 9. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android


      # --------------------------------------------------
      # 10. Configure correct Android MainActivity
      #     Correct package from capacitor.config.ts
      # --------------------------------------------------
      - name: Configure Android MainActivity
        run: |

          mkdir -p android/app/src/main/java/com/sundarbandraghouse/app

          cat > android/app/src/main/java/com/sundarbandraghouse/app/MainActivity.java <<'EOF'
          package com.sundarbandraghouse.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {

              private static final int BACKUP_FOLDER_REQUEST = 9001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {

                          @Override
                          public void handleOnBackPressed() {

                              if (getBridge() == null ||
                                  getBridge().getWebView() == null) {
                                  finish();
                                  return;
                              }

                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){"
                                  + "if(typeof window.goBack==='function'){"
                                  + "window.goBack();"
                                  + "return 'handled';"
                                  + "}"
                                  + "if(typeof window.enhancedBack==='function'){"
                                  + "window.enhancedBack();"
                                  + "return 'handled';"
                                  + "}"
                                  + "return 'exit';"
                                  + "})()",
                                  value -> {
                                      if (value == null ||
                                          value.contains("exit")) {
                                          finish();
                                      }
                                  }
                              );
                          }
                      }
                  );

                  if (getBridge() != null &&
                      getBridge().getWebView() != null) {

                      getBridge().getWebView().addJavascriptInterface(
                          new AndroidBridge(this),
                          "Android"
                      );
                  }
              }

              public class AndroidBridge {

                  private final Activity activity;

                  AndroidBridge(Activity activity) {
                      this.activity = activity;
                  }

                  @JavascriptInterface
                  public void exitApp() {
                      activity.runOnUiThread(() -> activity.finish());
                  }

                  @JavascriptInterface
                  public void selectBackupFolder() {

                      activity.runOnUiThread(() -> {

                          Intent intent =
                              new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);

                          intent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                          );

                          activity.startActivityForResult(
                              intent,
                              BACKUP_FOLDER_REQUEST
                          );
                      });
                  }

                  @JavascriptInterface
                  public void saveBackup(String json, String fileName) {

                      activity.runOnUiThread(() -> {

                          try {

                              android.content.SharedPreferences prefs =
                                  activity.getSharedPreferences(
                                      "sdh_backup",
                                      Context.MODE_PRIVATE
                                  );

                              String uriString =
                                  prefs.getString(
                                      "folder_uri",
                                      null
                                  );

                              if (uriString == null) {
                                  return;
                              }

                              Uri folderUri =
                                  Uri.parse(uriString);

                              android.content.ContentResolver resolver =
                                  activity.getContentResolver();

                              Uri fileUri =
                                  android.provider.DocumentsContract
                                      .createDocument(
                                          resolver,
                                          folderUri,
                                          "application/json",
                                          fileName
                                      );

                              if (fileUri == null) {
                                  return;
                              }

                              OutputStream output =
                                  resolver.openOutputStream(fileUri);

                              if (output == null) {
                                  return;
                              }

                              output.write(
                                  json.getBytes(
                                      java.nio.charset.StandardCharsets.UTF_8
                                  )
                              );

                              output.flush();
                              output.close();

                          } catch (Exception ignored) {
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode != BACKUP_FOLDER_REQUEST ||
                      resultCode != RESULT_OK ||
                      data == null ||
                      data.getData() == null) {
                      return;
                  }

                  Uri uri = data.getData();

                  try {

                      getContentResolver().takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION |
                          Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );

                      getSharedPreferences(
                          "sdh_backup",
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          "folder_uri",
                          uri.toString()
                      )
                      .apply();

                      String folderName = uri.getPath();

                      if (getBridge() != null &&
                          getBridge().getWebView() != null) {

                          String safeName =
                              folderName == null
                              ? "নির্বাচিত Folder"
                              : folderName
                                  .replace("\\", "\\\\")
                                  .replace("'", "\\'");

                          getBridge().getWebView()
                              .post(() -> {

                                  getBridge()
                                      .getWebView()
                                      .evaluateJavascript(
                                          "if(typeof window.onNativeBackupFolderSelected==='function')" +
                                          "{window.onNativeBackupFolderSelected('" +
                                          safeName +
                                          "');}",
                                          null
                                      );
                              });
                      }

                  } catch (Exception ignored) {
                  }
              }
          }
          EOF


      # --------------------------------------------------
      # 11. Sync again after native changes
      # --------------------------------------------------
      - name: Sync Capacitor after native configuration
        run: npx cap sync android


      # --------------------------------------------------
      # 12. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # --------------------------------------------------
      # 13. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      # --------------------------------------------------
      # 14. Verify APK exists
      # --------------------------------------------------
      - name: Verify APK
        run: |

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created."

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Sundarban-Drug-House-APK

          path:
            android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
