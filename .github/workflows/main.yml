name: Build Sundarban Drug House APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build PWA
        run: npm run build

      - name: Install Capacitor Android
        run: npm install @capacitor/android@8.5.2

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Back Button
        run: |
          mkdir -p android/app/src/main/java/com/sundarban/drughouse

          cat > android/app/src/main/java/com/sundarban/drughouse/MainActivity.java <<'EOF'
          package com.sundarban.drughouse;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().evaluateJavascript(
                          "typeof window.handleAndroidBack==='function' ? window.handleAndroidBack() : false",
                          null
                      );
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Sync Android again
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sundarban-Drug-House-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
